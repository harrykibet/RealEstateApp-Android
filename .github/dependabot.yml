# To enable Dependabot security updates, you must configure version updates.
# GitHub uses this file to track and automatically update dependencies.

version: 2
updates:
  # Maintain dependencies for Gradle
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    timezone: "UTC"
    open-pull-requests-limit: 10
    # Grouping updates to reduce PR noise
    groups:
      dependencies:
        patterns:
          - "*"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    timezone: "UTC"
    open-pull-requests-limit: 5
