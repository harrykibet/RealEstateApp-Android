version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Grouping to reduce noise in a multi-module project
    groups:
      androidx:
        patterns:
          - "androidx.*"
      compose:
        patterns:
          - "androidx.compose.*"
          - "org.jetbrains.kotlin.plugin.compose"
      firebase:
        patterns:
          - "com.google.firebase.*"
      media3:
        patterns:
          - "androidx.media3.*"
      hilt:
        patterns:
          - "com.google.dagger.*"
          - "androidx.hilt.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
