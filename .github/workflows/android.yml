name: Android CI with Keystore Signing and SonarQube Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set executable permission for gradlew
      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      # Set up JDK 17
      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Decode and store the keystore
      - name: Decode and Store Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # Generate gradle.properties for signing
      - name: Generate Gradle Properties for Signing
        run: |
          mkdir -p ~/.gradle
          cat <<EOF >> ~/.gradle/gradle.properties
          signingStoreFile=keystore.jks
          signingStorePassword=${{ secrets.KEYSTORE_PASSWORD }}
          signingKeyAlias=${{ secrets.KEY_ALIAS }}
          signingKeyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Cache Gradle dependencies
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      # Generate local.properties
      - name: Generate Local Properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Build the APK (Release variant)
      - name: Build APK with Gradle (Release)
        run: ./gradlew assembleRelease

      # Debug: List build output directory to check if APK exists
      - name: List Build Output Directory
        run: ls -alh app/build/outputs/apk/

      # Upload APK as an artifact (from debug or release folder)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  sonar:
    name: Build and Analyze with SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure a full clone for accurate analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build and Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar --info
