name: Android CI with Keystore Signing and SonarQube Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

env:
  CI: true  # Setting CI environment variable

jobs:
  setup:
    name: Setup & Define Modules
    runs-on: ubuntu-latest
    outputs:
      modules: "core feature_home feature_property feature_auth feature_search feature_profile ui_components feature_analytics feature_mediaplayer app localization security feature_intelligence feature_payments feature_marketplace feature_favorites feature_chats feature_notifications feature_comments feature_settings feature_service"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  sonar:
    name: SonarQube Analysis (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        module: [core, feature_home, feature_property, feature_auth, feature_search, feature_profile, ui_components, feature_analytics, feature_mediaplayer, app, localization, security, feature_intelligence, feature_payments, feature_marketplace, feature_favorites, feature_chats, feature_notifications, feature_comments, feature_settings, feature_service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Generate Local Properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build and Analyze ${{ matrix.module }} with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew ${{ matrix.module }}:sonar --no-configuration-cache --info

  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    needs: sonar

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Debug Keystore (if missing)
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v -keystore $HOME/.android/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already exists."
          fi

      - name: Decode and Store Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.gradle/keystore.jks

      - name: Generate Gradle Properties for Signing
        run: |
          mkdir -p ~/.gradle
          cat <<EOF >> ~/.gradle/gradle.properties
          signingStoreFile=~/.gradle/keystore.jks
          signingStorePassword=${{ secrets.KEYSTORE_PASSWORD }}
          signingKeyAlias=${{ secrets.KEY_ALIAS }}
          signingKeyPassword=${{ secrets.KEY_PASSWORD }}
          org.gradle.caching=true
          EOF

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Generate Local Properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK with Gradle (Release)
        run: ./gradlew assembleRelease --stacktrace

      - name: List Build Output Directory
        run: ls -alh app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
