name: Android CI with Keystore Signing and SonarQube Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

env:
  CI: true  # Setting CI environment variable

jobs:
  setup:
    name: Setup & Define Modules
    runs-on: ubuntu-latest
    outputs:
      modules: "app core:analytics core:common core:config core:data core:database core:datastore core:datastore-proto core:design-system core:domain core:localization core:model core:navigation core:network core:notifications core:player-engine core:player-ui core:security core:testing core:ui feature:auth feature:chats feature:comments feature:favorites feature:home feature:intelligence feature:market feature:payments feature:profile feature:property feature:search feature:service feature:settings"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Generate Local Properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run All Unit Tests
        run: ./gradlew test --no-configuration-cache --info

  lint:
    name: Static Analysis (Lint)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Generate Local Properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Lint
        run: ./gradlew lint --no-configuration-cache --info

      - name: Validate Firestore Rules
        run: npx -y firebase-tools deploy --only firestore:rules --dry-run

  sonar:
    name: SonarQube Analysis (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [setup, test]
    strategy:
      matrix:
        module: [app, core:analytics, core:common, core:config, core:data, core:database, core:datastore, core:datastore-proto, core:design-system, core:domain, core:localization, core:model, core:navigation, core:network, core:notifications, core:player-engine, core:player-ui, core:security, core:testing, core:ui, feature:auth, feature:chats, feature:comments, feature:favorites, feature:home, feature:intelligence, feature:market, feature:payments, feature:profile, feature:property, feature:search, feature:service, feature:settings]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Generate Local Properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build and Analyze ${{ matrix.module }} with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew ${{ matrix.module }}:sonar --no-configuration-cache --info

  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    needs: [sonar, test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Debug Keystore (if missing)
        run: |
          if [ ! -f "/root/.android/debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v -keystore /root/.android/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already exists."
          fi

      - name: Decode and Store Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.gradle/keystore.jks

      - name: Generate Gradle Properties for Signing
        run: |
          mkdir -p ~/.gradle
          cat <<EOF >> ~/.gradle/gradle.properties
          signingStoreFile=~/.gradle/keystore.jks
          signingStorePassword=${{ secrets.KEYSTORE_PASSWORD }}
          signingKeyAlias=${{ secrets.KEY_ALIAS }}
          signingKeyPassword=${{ secrets.KEY_PASSWORD }}
          org.gradle.caching=true
          EOF

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Generate Local Properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK with Gradle (Release)
        run: ./gradlew assembleRelease --stacktrace

      - name: List Build Output Directory
        run: ls -alh app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  firebase-deploy:
    name: Deploy Firebase Rules
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Firestore Rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN is not set. Skipping rules deployment."
          else
            npx -y firebase-tools deploy --only firestore:rules --token "$FIREBASE_TOKEN"
          fi
