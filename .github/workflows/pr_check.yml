name: PR Check (Fast Feedback)

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

env:
  CI: true

jobs:
  architecture-and-policy:
    name: Architecture & Policy (Lint Ratchet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Lint Ratchet (Architecture, Dependency, Purity)
        # This job enforces all 33+ Architectural Laws
        run: ./gradlew lint --no-configuration-cache --info

  logic-verification:
    name: Logic Verification (Unit & Architecture Tests)
    runs-on: ubuntu-latest
    needs: [architecture-and-policy]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Run All Tests (Unit + Architecture)
        run: ./gradlew test --no-configuration-cache --info

      - name: Verify Code Coverage Ratchet
        run: ./gradlew jacocoProdDebugVerification --no-configuration-cache --info

  smoke-test:
    name: Smoke Instrumented Tests (Small GMD)
    runs-on: ubuntu-latest
    needs: [logic-verification]
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Run Smoke UI Tests (Pixel 2 Api 34)
        run: ./gradlew :app:pixel2Api34ProdDebugAndroidTest --no-configuration-cache --info
