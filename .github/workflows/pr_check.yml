name: PR Check (Fast Feedback)

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

env:
  CI: true

jobs:
  architecture-gate:
    name: Level 0 - Architecture & Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Verify Architecture Contract
        # 🏗️ AUTHORITATIVE GATE: Runs Lint, KSP, Konsist, and Canary heartbeat.
        run: ./gradlew verifyArchitecture --no-configuration-cache --info

      - name: Self-Healing Ratchet (Update Lint Baselines)
        if: github.event_name == 'pull_request'
        # Automatically update baselines if violations decreased
        run: ./gradlew lint -Dlint.update.baseline=true --no-configuration-cache
      
      - name: Commit Baseline Updates
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update lint baselines (ratchet)"
          file_pattern: "**/lint-baseline.xml"

  logic-verification:
    name: Level 1 - Logic & Coverage
    runs-on: ubuntu-latest
    needs: [architecture-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Run Unit Tests
        # Skip architecture tests here as they were checked in Level 0
        run: ./gradlew test -x :core:testing-architecture:test --no-configuration-cache --info

      - name: Verify Coverage Ratchet
        run: ./gradlew jacocoProdDebugVerification --no-configuration-cache --info

  smoke-test:
    name: Level 2 - Smoke UI (Pixel 2)
    runs-on: ubuntu-latest
    needs: [logic-verification]
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Run Smoke UI Tests
        run: ./gradlew :app:pixel2Api34ProdDebugAndroidTest --no-configuration-cache --info
