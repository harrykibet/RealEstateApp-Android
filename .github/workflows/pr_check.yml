name: PR Check (Fast Feedback)

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

env:
  CI: true

jobs:
  test:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lint --no-configuration-cache --info

      - name: Run All Unit Tests
        run: ./gradlew test --no-configuration-cache --info

  smoke-test:
    name: Smoke Instrumented Tests
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Smoke Tests (app only)
        # Using the smallest GMD for speed in PR
        run: ./gradlew :app:pixel2Api34ProdDebugAndroidTest --no-configuration-cache --info
