name: PR Check (High Maturity)

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

env:
  CI: true

jobs:
  architecture-gate:
    name: Level 0 - Architecture & Policy
    runs-on: ubuntu-latest
    outputs:
      impact_tasks: ${{ steps.impact.outputs.tasks }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff origin/main

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Verify Architecture Contract
        # 🏗️ AUTHORITATIVE GATE: Runs Lint, KSP, Konsist, Canary, and Drift checks.
        run: ./gradlew verifyArchitecture --no-configuration-cache --info

      - name: Calculate Impact (Selective Testing)
        id: impact
        run: |
          ./gradlew calculateImpact --no-configuration-cache > impact_output.txt
          TASKS=$(grep "IMPACT_TASKS=" impact_output.txt | cut -d'=' -f2)
          if [ -z "$TASKS" ]; then TASKS="test lint"; fi
          echo "tasks=$TASKS" >> $GITHUB_OUTPUT
          echo "Identified Impacted Tasks: $TASKS"

      - name: Self-Healing Ratchet (Update Lint Baselines)
        # Automatically update baselines if violations decreased
        run: ./gradlew lint -Dlint.update.baseline=true --no-configuration-cache
      
      - name: Commit Baseline Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update lint baselines (ratchet)"
          file_pattern: "**/lint-baseline.xml"

  selective-verification:
    name: Level 1 - Impacted Verification
    runs-on: ubuntu-latest
    needs: [architecture-gate]
    if: needs.architecture-gate.outputs.impact_tasks != ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Run Impacted Tasks
        run: ./gradlew ${{ needs.architecture-gate.outputs.impact_tasks }} --no-configuration-cache --info

      - name: Verify Coverage Ratchet
        run: ./gradlew jacocoProdDebugVerification --no-configuration-cache --info

  smoke-test:
    name: Level 2 - Smoke UI (Pixel 2)
    runs-on: ubuntu-latest
    needs: [selective-verification]
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Run Smoke UI Tests
        run: ./gradlew :app:pixel2Api34ProdDebugAndroidTest --no-configuration-cache --info
