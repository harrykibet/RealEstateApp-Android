name: Main Branch Verification

on:
  push:
    branches: [ "main" ]

env:
  CI: true

jobs:
  full-test:
    name: Full Test Suite (Unit + Instrumented)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run All Unit Tests
        run: ./gradlew test --no-configuration-cache --info

      - name: Run Full Instrumented Tests (All GMDs)
        # Running on multiple device shapes as suggested
        run: |
          ./gradlew :app:pixel2Api34ProdDebugAndroidTest \
                    :app:pixel6Api31ProdDebugAndroidTest \
                    :app:mediumPhoneApi33ProdDebugAndroidTest \
                    :app:pixelTabletApi34ProdDebugAndroidTest \
                    --no-configuration-cache --info

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [full-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set Executable Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Decode and Store Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > local_keystore.jks

      - name: Build APK with Gradle (Release)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleProdRelease -PsigningStoreFile=local_keystore.jks --stacktrace

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/prod/release/app-prod-release.apk
