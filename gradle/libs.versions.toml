androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }

# Google Cloud
google-cloud-bom = "com.google.cloud:libraries-bom:26.75.0"
google-cloud-kms = { module = "com.google.cloud:google-cloud-kms" }
google-cloud-secretmanager = { module = "com.google.cloud:google-cloud-secretmanager" }


# Caching
caffeine = "com.github.ben-manes.caffeine:caffeine:3.2.3"




# Analytics and Perfomance
opentelemetry-api = "io.opentelemetry:opentelemetry-api:1.59.0"
opentelemetry-exporter-otlp = "io.opentelemetry:opentelemetry-exporter-otlp:1.59.0"
micrometer-core = "io.micrometer:micrometer-core:1.16.2"
micrometer-registry-prometheus = "io.micrometer:micrometer-registry-prometheus:1.16.2"
conscrypt-openjdk-uber = "org.conscrypt:conscrypt-openjdk-uber:2.5.2"
metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "androidx-metrics" }
play-services-appset = { group = "com.google.android.gms", name = "play-services-appset", version.ref = "google-android-play-services-appset" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
leakcanary-android-instrumentation = { group = "com.squareup.leakcanary", name = "leakcanary-android-instrumentation", version.ref = "leakcanary" }


# Dependencies of the included build-logic
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
firebase-crashlytics-gradle-plugin = { group = "com.google.firebase", name = "firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }
firebase-performance-gradle-plugin = { group = "com.google.firebase", name = "perf-plugin", version.ref = "firebasePerfPlugin" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradle-plugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "androidx-room" }
sonarqube-gradle-plugin = { group = "org.sonarqube", name = "org.sonarqube.gradle.plugin", version.ref = "sonarqube" }
dokka-gradle-plugin = {group = "org.jetbrains.dokka", name = "dokka-gradle-plugin", version.ref = "dokka"}


