---
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
workflows:
  build_apk:
    summary: Run your Android unit tests and create an APK file to install your app
      on a device or share it with your team.
    description: The workflow will first clone your Git repository, install Android
      tools, set the project's version code based on the build number, run Android
      lint and unit tests, build the project's APK file and save it.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            #!/bin/bash
            echo "sdk.dir=$ANDROID_HOME" > "$BITRISE_SOURCE_DIR/local.properties"
        title: Install Local Properties file
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$BITRISE_SOURCE_DIR/gradlew"
    - change-android-versioncode-and-versionname@1:
        inputs:
        - build_gradle_path: "$BITRISE_SOURCE_DIR/$MODULE/build.gradle.kts"
    - script@1:
        inputs:
        - content: "- script@1:\n    title: Generate Debug Keystore\n    inputs:\n
            \   - content: |-\n        #!/bin/bash\n        # Define the keystore
            path\n        KEYSTORE_PATH=\"$HOME/.android/debug.keystore\"\n        \n
            \       # Remove existing keystore if it exists\n        if [ -f \"$KEYSTORE_PATH\"
            ]; then\n            echo \"Removing existing debug keystore...\"\n            rm
            -f \"$KEYSTORE_PATH\"\n        fi\n        \n        # Generate a new
            debug keystore\n        echo \"Generating new debug keystore...\"\n        keytool
            -genkey -v \\\n                -keystore \"$KEYSTORE_PATH\" \\\n                -storepass
            android \\\n                -alias androiddebugkey \\\n                -keypass
            android \\\n                -dname \"CN=Android Debug,O=Android,C=US\"
            \\\n                -keyalg RSA \\\n                -keysize 2048 \\\n
            \               -validity 10000\n\n        echo \"Debug keystore generated
            at $KEYSTORE_PATH\"\n"
        title: Generate Debug Keystore
    - android-build@1:
        inputs:
        - module: "$MODULE"
        - variant: "$VARIANT"
        - cache_level: all
        - build_type: aab
    - sign-apk@2: {}
    - deploy-to-bitrise-io@2: {}
    meta:
      bitrise.io:
        machine_type_id: standard
  run_tests:
    summary: Run your Android unit tests and get the test report.
    description: The workflow will first clone your Git repository, cache your Gradle
      dependencies, install Android tools, run your Android unit tests and save the
      test report.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            #!/bin/bash
            echo "sdk.dir=$ANDROID_HOME" > "$BITRISE_SOURCE_DIR/local.properties"
        title: Local Properties
    - restore-gradle-cache@2: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - android-unit-test@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: "$VARIANT"
        - cache_level: all
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}
    triggers:
      push:
      - branch: main
      pull_request:
      - source_branch: "*"
  build_apk_release:
    summary: Run your Android unit tests and create an APK file to install your app
      on a device or share it with your team.
    description: The workflow will first clone your Git repository, install Android
      tools, set the project's version code based on the build number, run Android
      lint and unit tests, build the project's APK file and save it.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            #!/bin/bash
            echo "sdk.dir=$ANDROID_HOME" > "$BITRISE_SOURCE_DIR/local.properties"
        title: Install Local Properties file
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$BITRISE_SOURCE_DIR/gradlew"
    - change-android-versioncode-and-versionname@1:
        inputs:
        - build_gradle_path: "$BITRISE_SOURCE_DIR/$MODULE/build.gradle.kts"
    - activate-build-cache-for-gradle@2: {}
    - android-lint@0:
        inputs:
        - variant: "$VARIANT"
        - cache_level: all
    - android-unit-test@1:
        inputs:
        - variant: "$VARIANT"
        - cache_level: all
    - script@1:
        title: Generate Release Keystore
        inputs:
        - content: "#!/bin/bash\n\n# Define the keystore path and name\nKEYSTORE_PATH=\"$HOME/.android/release.keystore\"\nKEYSTORE_ALIAS=\"key0\"\nKEYSTORE_PASSWORD=\"2001birth\"\nKEY_PASSWORD=\"2001birth\"\nDNAME=\"CN=MyApp,
            OU=MyCompany, O=MyCompany, L=City, ST=State, C=US\"\nKEY_ALG=\"RSA\"\nKEY_SIZE=\"2048\"\nVALIDITY=\"10000\"\n\n#
            Check if keystore already exists\nif [ -f \"$KEYSTORE_PATH\" ]; then\n
            \   echo \"Keystore already exists at $KEYSTORE_PATH. Skipping creation.\"\nelse\n
            \   echo \"Creating new release keystore at $KEYSTORE_PATH...\"\n    \n
            \   # Generate the keystore\n    keytool -genkey -v \\\n            -keystore
            \"$KEYSTORE_PATH\" \\\n            -storepass \"$KEYSTORE_PASSWORD\" \\\n
            \           -alias \"$KEYSTORE_ALIAS\" \\\n            -keypass \"$KEY_PASSWORD\"
            \\\n            -dname \"$DNAME\" \\\n            -keyalg \"$KEY_ALG\"
            \\\n            -keysize \"$KEY_SIZE\" \\\n            -validity \"$VALIDITY\"\n
            \   \n    echo \"Keystore created successfully at $KEYSTORE_PATH\"\nfi\n"
    - android-build@1:
        inputs:
        - module: "$MODULE"
        - variant: "$VARIANTrelease"
        - cache_level: all
    - sign-apk@2: {}
    - deploy-to-bitrise-io@2: {}
meta:
  bitrise.io:
    stack: linux-docker-android-22.04
app:
  envs:
  - PROJECT_LOCATION: "."
    opts:
      is_expand: false
  - MODULE: app
    opts:
      is_expand: false
  - VARIANT: release
    opts:
      is_expand: false
  - CI: true
    opts:
      is_expand: false
