android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# Temporary escape hatch for AGP 9.0+ New DSL transition.
# Required for compatibility with plugins not yet supporting the new DSL interfaces (e.g., androidx.baselineprofile).
# See: https://developer.android.com/build/releases/past-releases/agp-9-0-0-release-notes#new-dsl
android.newDsl=false
android.enableDexingArtifactTransform.parallel=true

kotlin.incremental=true
kotlin.parallel.tasks.in.project=true

ksp.incremental=true
ksp.cache.enabled=true

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:+UseG1GC

