# ================================
#  Gradle & Kotlin Daemon JVM Args
# ================================
# Optimized for:
# - Machine: **4 vCPU @ 3.1GHz, 16GB RAM**
# - CI/CD Environment
# - High-performance builds with ZGC
#
# Notes for customization:
# - If your **machine has less RAM**, reduce `-Xmx` and `-Xms` values accordingly.
# - If your **machine has more RAM**, you can increase heap size for faster builds.
# - Adjust `-XX:ParallelGCThreads` and `-XX:ConcGCThreads` based on your **CPU cores**.
# - Keep at least **4GB of RAM free** for system stability.
#
# See: https://docs.gradle.org/current/userguide/build_environment.html

#
# ===================== JVM & Memory Configuration =====================
#
# Optimized JVM arguments for Gradle builds to improve performance,
# reduce garbage collection (GC) overhead, and enhance build stability.
#
# Key Features:
# - Uses G1 Garbage Collector (G1GC) for efficient memory management.
# - Preallocates heap and metaspace sizes to avoid frequent resizing.
# - Configures GC threads to optimize pause times and background collection.
# - Enables diagnostic options for better debugging.
#
# ========================= Arguments Explained =========================
#
# -Dfile.encoding=UTF-8
#   Ensures UTF-8 encoding for consistent text handling across platforms.
#
# -XX:+UseG1GC
#   Enables the Garbage-First (G1) garbage collector, reducing pause times.
#
# -XX:SoftRefLRUPolicyMSPerMB=1
#   Aggressively clears soft references based on available heap memory.
#
# -XX:ReservedCodeCacheSize=512m
#   Allocates 512MB for compiled code cache, preventing JIT slowdowns.
#
# -XX:+HeapDumpOnOutOfMemoryError
#   Generates a heap dump for debugging when an OutOfMemoryError occurs.
#
# -Xmx6g
#   Sets the maximum heap size to 6GB, preventing excessive memory use.
#
# -Xms2g
#   Sets the initial heap size to 2GB, avoiding unnecessary dynamic allocations.
#
# -XX:MaxMetaspaceSize=1g
#   Restricts Metaspace to 1GB to control class metadata memory usage.
#
# -XX:+AlwaysPreTouch
#   Pre-allocates memory upfront to improve performance and reduce latency.
#
# -XX:MaxGCPauseMillis=200
#   Configures G1GC to aim for maximum 200ms GC pauses.
#
# -XX:ParallelGCThreads=4
#   Allocates 4 CPU threads for stop-the-world garbage collection operations.
#
# -XX:ConcGCThreads=2
#   Allocates 2 concurrent background threads for garbage collection.
#
# If you have more than 8 CPU cores, you can increase ParallelGCThreads
# to 8 and ConcGCThreads to 3 or 4 for even better build performance.
# ========================
# JVM & Memory Configuration
# ========================
org.gradle.jvmargs=-Dfile.encoding=UTF-8 \
-XX:+UseG1GC \
-XX:SoftRefLRUPolicyMSPerMB=1 \
-XX:ReservedCodeCacheSize=512m \
-XX:+HeapDumpOnOutOfMemoryError \
-Xmx6g \
-Xms2g \
-XX:MaxMetaspaceSize=1g \
-XX:+AlwaysPreTouch \
-XX:MaxGCPauseMillis=200 \
-XX:ParallelGCThreads=4 \
-XX:ConcGCThreads=2

#
# ===================== Kotlin Daemon Configuration =====================
#
# Optimized JVM arguments for the Kotlin compiler daemon to improve
# compilation performance, reduce memory overhead, and enhance stability.
#
# Key Features:
# - Uses G1 Garbage Collector (G1GC) for efficient memory management.
# - Preallocates heap and metaspace sizes to avoid frequent resizing.
# - Optimizes the Kotlin compilation process for large projects.
# - Enables debugging options for crash diagnostics.
#
# ========================= Arguments Explained =========================
#
# -Dfile.encoding=UTF-8
#   Ensures UTF-8 encoding for consistent text handling across platforms.
#
# -XX:+UseG1GC
#   Enables the Garbage-First (G1) garbage collector, reducing pause times.
#
# -XX:SoftRefLRUPolicyMSPerMB=1
#   Aggressively clears soft references based on available heap memory.
#
# -XX:ReservedCodeCacheSize=512m
#   Allocates 512MB for compiled code cache, preventing JIT slowdowns.
#
# -XX:+HeapDumpOnOutOfMemoryError
#   Generates a heap dump for debugging when an OutOfMemoryError occurs.
#
# -Xmx6g
#   Sets the maximum heap size to 6GB, ensuring enough memory for large projects.
#
# -Xms2g
#   Sets the initial heap size to 2GB, avoiding unnecessary dynamic allocations.
#
# -XX:MaxMetaspaceSize=1g
#   Restricts Metaspace to 1GB to control class metadata memory usage.
#
# -XX:+AlwaysPreTouch
#   Pre-allocates memory upfront to improve performance and reduce latency.
#
# ========================
# Kotlin Daemon Configuration 
# ========================
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 \
-XX:+UseG1GC \
-XX:SoftRefLRUPolicyMSPerMB=1 \
-XX:ReservedCodeCacheSize=512m \
-XX:+HeapDumpOnOutOfMemoryError \
-Xmx6g \
-Xms2g \
-XX:MaxMetaspaceSize=1g \
-XX:+AlwaysPreTouch


# ========================
# Android Configuration
# ========================
android.nonTransitiveRClass=true
android.useAndroidX=true
# Disable jetifier if possible (check dependencies first)
android.enableJetifier=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.enablePrecompiledSdk=false

# ========================
# Build Performance
# ========================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true
org.gradle.unsafe.watch-fs=true
# ========================
# Dependency Management
# ========================
org.gradle.dependency.verification=strict
org.gradle.caching.local.directory=.gradle-cache
org.gradle.console=rich
org.gradle.warning.mode=summary

# ========================
# Kotlin & KSP Optimizations
# ========================
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
kotlin.caching.enabled=true
ksp.incremental=true
ksp.cache.enabled=true
ksp.verbose=false

# ========================
# Advanced Build Features
# ========================
org.gradle.unsafe.optimized-project-access=true
org.gradle.unsafe.isolated-projects=false
org.gradle.unsafe.configuration-cache.max-problems=20
org.gradle.configureondemand=true