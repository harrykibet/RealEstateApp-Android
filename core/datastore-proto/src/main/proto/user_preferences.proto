syntax = "proto3";

import "dark_theme_config.proto";
import "theme_brand.proto";

option java_package = "com.application.real_estate_app.core_datastore";
option java_multiple_files = true;

message UserPreferences {
    reserved 2;
    repeated int32 deprecated_int_followed_property_ids = 1;
    int32 propertyChangeListVersion = 3;
    int32 ownerChangeListVersion = 4;
    int32 userChangeListVersion = 6;
    repeated int32 deprecated_int_followed_owner_ids = 7;
    bool has_done_int_to_string_id_migration = 8;
    repeated string deprecated_followed_property_ids = 9;
    repeated string deprecated_followed_owner_ids = 10;
    repeated string deprecated_bookmarked_property_ids = 11;
    bool has_done_list_to_map_migration = 12;

    // Each map is used to store a set of string IDs. The bool has no meaning, but proto3 doesn't
    // have a Set type so this is the closest we can get to a Set.
    map<string, bool> followed_property_ids = 13;
    map<string, bool> followed_owner_ids = 14;
    map<string, bool> bookmarked_property_ids = 15;
    map<string, bool> viewed_property_ids = 20;

    ThemeBrandProto theme_brand = 16;
    DarkThemeConfigProto dark_theme_config = 17;

    bool should_hide_onboarding = 18;

    bool use_dynamic_color = 19;

    // NEXT AVAILABLE ID: 21
}
