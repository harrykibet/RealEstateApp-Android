workflows:

  # ------------------------------------------------------------------------------
  # 🛡️ PR CHECK (High Maturity Gate)
  # ------------------------------------------------------------------------------
  pr-check:
    name: Estatia PR Check
    max_build_duration: 30
    instance_type: mac_studio_m4_max
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        CI: "true"
    scripts:
      - name: Set Permissions
        script: chmod +x ./gradlew
      - name: Architecture Gate
        # 🏗️ AUTHORITATIVE GATE: Runs Lint, KSP, Konsist, and Canary heartbeat.
        script: ./gradlew verifyArchitecture --no-daemon
      - name: Calculate Impact (Selective Testing)
        script: |
          ./gradlew calculateImpact --no-daemon > impact_output.txt
          TASKS=$(grep "IMPACT_TASKS=" impact_output.txt | cut -d'=' -f2)
          if [ -z "$TASKS" ]; then TASKS="test lint"; fi
          echo "export TASKS_TO_RUN=\"$TASKS\"" >> $CM_ENV
      - name: Logic Verification (Impacted Modules)
        script: |
          ./gradlew $TASKS_TO_RUN --no-daemon
          ./gradlew jacocoProdDebugVerification --no-daemon
      - name: Smoke UI Test
        script: ./gradlew :app:pixel2Api34ProdDebugAndroidTest --no-daemon

  # ------------------------------------------------------------------------------
  # ⚓ MAIN BRANCH (Authoritative Verification)
  # ------------------------------------------------------------------------------
  main-verification:
    name: Estatia Main Verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        CI: "true"
      groups:
        - signing_release
    scripts:
      - name: Set Permissions
        script: chmod +x ./gradlew
      - name: Authoritative Verification
        script: ./gradlew verifyArchitecture --no-daemon
      - name: Full Logic Verification
        script: ./gradlew test --no-daemon
      - name: Full UI Verification (All GMDs)
        script: |
          ./gradlew :app:pixel2Api34ProdDebugAndroidTest \
                    :app:pixel6Api31ProdDebugAndroidTest \
                    :app:mediumPhoneApi33ProdDebugAndroidTest \
                    :app:pixelTabletApi34ProdDebugAndroidTest \
                    --no-daemon
      - name: Build Release APK
        script: ./gradlew assembleProdRelease --no-daemon
    artifacts:
      - app/build/outputs/apk/prod/release/*.apk

