workflows:
  native-android:
    name: Native Android
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        CI: "true"
        PACKAGE_NAME: "io.codemagic.androidquicksample"

      groups:
        - google_play
        - android_signing

    scripts:

      - name: Enable HiDPI display modes
        script: |
          echo "Enabling HiDPI modes for VNC session..."
          sudo defaults write /Library/Preferences/com.apple.windowserver DisplayResolutionEnabled -bool true

      - name: Install displayplacer
        script: |
          echo "Installing displayplacer..."
          brew update
          brew install displayplacer || true

      - name: Configure VNC screen resolution
        script: |
          echo "Detecting display..."
          DISPLAY_ID=$(displayplacer list | awk '/Persistent screen id/ {print $4; exit}')

          if [ -z "$DISPLAY_ID" ]; then
            echo "Display ID not detected. Skipping resolution configuration."
          else
            echo "Setting 4K resolution for VNC session..."
            displayplacer "id:$DISPLAY_ID res:3840x2160 scaling:on" || \
            displayplacer "id:$DISPLAY_ID res:2560x1440 scaling:on" || \
            displayplacer "id:$DISPLAY_ID res:1920x1080 scaling:on"
          fi

          echo "Current display configuration:"
          system_profiler SPDisplaysDataType | grep Resolution || true

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Generate Debug Keystore
        script: |
          DEBUG_KEYSTORE_PATH="/root/.android/debug.keystore"

          sudo mkdir -p /root/.android

          if [ -f "$DEBUG_KEYSTORE_PATH" ]; then
            echo "Removing existing debug keystore..."
            rm -f "$DEBUG_KEYSTORE_PATH"
          fi

          echo "Generating new debug keystore..."
          keytool -genkey -v \
            -keystore "$DEBUG_KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          sudo chmod 644 "$DEBUG_KEYSTORE_PATH"

          echo "Debug keystore generated at $DEBUG_KEYSTORE_PATH"

      - name: Set Gradlew Permissions
        script: |
          chmod +x ./gradlew

      - name: Build Android Release APK
        script: |
          ./gradlew assembleRelease \
            -PversionCode=1 \
            -PversionName=1.0.2 \
            --build-cache \
            --no-daemon

      - name: Check APK Existence
        script: |
          APK_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)

          if [ -f "$APK_FILE" ]; then
            echo "APK found: $APK_FILE"
          else
            echo "ERROR: APK not found in $APK_DIR"
            exit 1
          fi

      - name: Sign the APK
        script: |
          APK_DIR="app/build/outputs/apk/release"

          APK_FILE=$(find "$APK_DIR" -name "*-unsigned.apk" | head -n 1)

          if [ -f "$APK_FILE" ]; then
            SIGNED_APK="${APK_FILE%-unsigned.apk}.apk"

            echo "Signing APK: $APK_FILE"

            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$CM_KEYSTORE_PATH" \
              -storepass "$CM_KEYSTORE_PASSWORD" \
              -keypass "$CM_KEY_PASSWORD" \
              "$APK_FILE" "$CM_KEY_ALIAS"

            mv "$APK_FILE" "$SIGNED_APK"

            echo "Signed APK: $SIGNED_APK"

          else
            SIGNED_APK=$(find "$APK_DIR" -name "*.apk" | head -n 1)

            if [ -f "$SIGNED_APK" ]; then
              echo "APK already signed: $SIGNED_APK"
            else
              echo "ERROR: No APK found (unsigned or signed)"
              exit 1
            fi
          fi

      - name: Verify APK Directory
        script: |
          echo "APK directory contents:"
          ls -alh app/build/outputs/apk/release/

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: true