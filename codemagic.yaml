workflows:
  native-android:
    name: Native Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "io.codemagic.androidquicksample"
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android release
        script: |
          ./gradlew bundleRelease -PversionCode=1.0 -PversionName=1.0.2
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: false
