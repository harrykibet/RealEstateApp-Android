workflows:
  native-android:
    name: Native Android
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        CI: "true"
        PACKAGE_NAME: "io.codemagic.androidquicksample"
      groups:
        - google_play
        - android_signing

    scripts:

      - name: Enable HiDPI display modes
        script: |
          echo "Enabling HiDPI modes..."
          sudo defaults write /Library/Preferences/com.apple.windowserver DisplayResolutionEnabled -bool true || true

      - name: Install display utilities
        script: |
          echo "Installing displayplacer..."
          brew update || true
          brew install displayplacer || true

      - name: Trigger QuickTime framebuffer expansion
        script: |
          echo "Launching QuickTime Player recording window to force larger framebuffer..."
          osascript <<EOF
          tell application "QuickTime Player"
              activate
              try
                  new movie recording
              end try
          end tell
          EOF
          sleep 5

      - name: Detect available display modes
        script: |
          echo "Reading display configuration..."

          DISPLAY_ID=$(displayplacer list | awk '/Persistent screen id/ {print $4; exit}')

          if [ -z "$DISPLAY_ID" ]; then
            echo "No display detected. Skipping resolution configuration."
            exit 0
          fi

          echo "Detected display: $DISPLAY_ID"

          echo "Available resolutions:"
          displayplacer list | grep -Eo '[0-9]{3,5}x[0-9]{3,5}' | sort -u || true

      - name: Apply best available resolution
        script: |
          DISPLAY_ID=$(displayplacer list | awk '/Persistent screen id/ {print $4; exit}')

          BEST_RES=$(displayplacer list \
            | grep -Eo '[0-9]{3,5}x[0-9]{3,5}' \
            | sort -t x -k1 -nr -k2 -nr \
            | head -n 1)

          if [ -z "$BEST_RES" ]; then
            echo "No usable resolution detected."
            exit 0
          fi

          echo "Applying best resolution: $BEST_RES"

          displayplacer "id:$DISPLAY_ID res:$BEST_RES scaling:on" || true

          echo "Final display state:"
          system_profiler SPDisplaysDataType | grep Resolution || true

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Generate Debug Keystore
        script: |
          DEBUG_KEYSTORE_PATH="/root/.android/debug.keystore"

          sudo mkdir -p /root/.android

          if [ -f "$DEBUG_KEYSTORE_PATH" ]; then
            echo "Removing existing debug keystore..."
            rm -f "$DEBUG_KEYSTORE_PATH"
          fi

          echo "Generating debug keystore..."

          keytool -genkey -v \
            -keystore "$DEBUG_KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          sudo chmod 644 "$DEBUG_KEYSTORE_PATH"

      - name: Set Gradlew Permissions
        script: |
          chmod +x ./gradlew

      - name: Build Android release APK
        script: |
          ./gradlew assembleRelease \
            -PversionCode=1 \
            -PversionName=1.0.2 \
            --build-cache \
            --no-daemon

      - name: Check APK existence
        script: |
          APK_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)

          if [ -f "$APK_FILE" ]; then
            echo "APK found: $APK_FILE"
          else
            echo "ERROR: APK not found"
            exit 1
          fi

      - name: Sign APK if required
        script: |
          APK_DIR="app/build/outputs/apk/release"

          APK_FILE=$(find "$APK_DIR" -name "*-unsigned.apk" | head -n 1)

          if [ -f "$APK_FILE" ]; then

            SIGNED_APK="${APK_FILE%-unsigned.apk}.apk"

            echo "Signing APK..."

            jarsigner \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$CM_KEYSTORE_PATH" \
              -storepass "$CM_KEYSTORE_PASSWORD" \
              -keypass "$CM_KEY_PASSWORD" \
              "$APK_FILE" "$CM_KEY_ALIAS"

            mv "$APK_FILE" "$SIGNED_APK"

            echo "Signed APK: $SIGNED_APK"

          else

            SIGNED_APK=$(find "$APK_DIR" -name "*.apk" | head -n 1)

            if [ -f "$SIGNED_APK" ]; then
              echo "APK already signed."
            else
              echo "ERROR: No APK found"
              exit 1
            fi
          fi

      - name: Verify APK directory
        script: |
          echo "APK directory contents:"
          ls -alh app/build/outputs/apk/release/

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: true