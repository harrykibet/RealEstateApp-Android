workflows:

  # ------------------------------------------------------------------------------
  # 🛡️ PR CHECK (High Maturity Gate)
  # ------------------------------------------------------------------------------
  pr-check:
    name: Estatia PR Check
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        CI: "true"
    scripts:
      - name: Set Permissions
        script: chmod +x ./gradlew
      - name: Architecture Gate
        # 🏗️ AUTHORITATIVE GATE: Runs Lint, KSP, Konsist, and Canary heartbeat.
        script: ./gradlew verifyArchitecture --no-daemon
      - name: Logic Verification
        script: ./gradlew test -x :core:testing-architecture:test --no-daemon
      - name: Verify Coverage
        script: ./gradlew jacocoProdDebugVerification --no-daemon
      - name: Smoke UI Test
        script: ./gradlew :app:pixel2Api34ProdDebugAndroidTest --no-daemon

  # ------------------------------------------------------------------------------
  # ⚓ MAIN BRANCH (Authoritative Verification)
  # ------------------------------------------------------------------------------
  main-verification:
    name: Estatia Main Verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        CI: "true"
      groups:
        - signing_release
    scripts:
      - name: Set Permissions
        script: chmod +x ./gradlew
      - name: Authoritative Verification
        script: ./gradlew verifyArchitecture --no-daemon
      - name: Full Logic Verification
        script: ./gradlew test --no-daemon
      - name: Full UI Verification (All GMDs)
        script: |
          ./gradlew :app:pixel2Api34ProdDebugAndroidTest \
                    :app:pixel6Api31ProdDebugAndroidTest \
                    :app:mediumPhoneApi33ProdDebugAndroidTest \
                    :app:pixelTabletApi34ProdDebugAndroidTest \
                    --no-daemon
      - name: Build Release APK
        script: ./gradlew assembleProdRelease --no-daemon
    artifacts:
      - app/build/outputs/apk/prod/release/*.apk

  # ------------------------------------------------------------------------------
  # 🔨 NIGHTLY (Stress & Audit)
  # ------------------------------------------------------------------------------
  nightly-optimization:
    name: Estatia Nightly Optimization
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      schedule:
        - cron: "0 0 * * *"
          branch: main
    environment:
      vars:
        CI: "true"
    scripts:
      - name: Set Permissions
        script: chmod +x ./gradlew
      - name: Multi-Variant Architecture Audit
        script: ./gradlew verifyArchitecture lint --no-daemon
      - name: Binary Purity Audit (R8)
        script: |
          ./gradlew :app:assembleProdRelease --no-daemon
          ./gradlew auditBinaryPurity --no-daemon
      - name: Chaos Tests
        script: ./gradlew :app:pixel6Api31ProdDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.estatia.realestate.apps.chaos.FeedGestureChaosTest
      - name: Performance Optimization (Baseline Profiles)
        script: ./gradlew :app:generateProdBaselineProfile --no-daemon
      - name: Run Benchmarks
        script: ./gradlew :benchmark:pixel6Api31ProdDebugAndroidTest --no-daemon
      - name: Code Quality & Mutation Testing
        script: |
          ./gradlew jacocoProdDebugReport --no-daemon
    artifacts:
      - benchmark/build/outputs/connected_android_test_additional_output/*
      - "**/build/reports/jacoco/**"
