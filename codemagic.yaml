workflows:
  native-android:
    name: Native Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        CI: "true"  # Define CI environment variable for Kotlin daemon optimization
        PACKAGE_NAME: "io.codemagic.androidquicksample"
      groups:
        - google_play      # Stores Google Play API credentials
        - android_signing  # Stores Keystore file & passwords
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Generate Debug Keystore
        script: |
          DEBUG_KEYSTORE_PATH="/root/.android/debug.keystore"
          
          # Ensure the directory exists
          sudo mkdir -p /root/.android

          # Remove existing debug keystore if it exists
          if [ -f "$DEBUG_KEYSTORE_PATH" ]; then
            echo "Removing existing debug keystore..."
            rm -f "$DEBUG_KEYSTORE_PATH"
          fi

          # Generate a new debug keystore
          echo "Generating new debug keystore..."
          keytool -genkey -v \
            -keystore "$DEBUG_KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          
          # Ensure proper file permissions
          sudo chmod 644 $DEBUG_KEYSTORE_PATH 

          echo "Debug keystore generated at $DEBUG_KEYSTORE_PATH"

      - name: Set Gradlew Permissions
        script: |
          chmod +x ./gradlew

      - name: Build Android release (APK)
        script: |
          ./gradlew assembleRelease -PversionCode=1.0 -PversionName=1.0.2 --build-cache

      - name: Check APK Existence
        script: |
          APK_DIR="app/build/outputs/apk/release/"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)

          if [ -f "$APK_FILE" ]; then
            echo "✅ APK found: $APK_FILE"
          else
            echo "❌ ERROR: APK not found in $APK_DIR"
            exit 1
          fi


      - name: Sign the APK
        script: |
          APK_DIR="app/build/outputs/apk/release/"
          
          # Try to find an unsigned APK first
          APK_FILE=$(find "$APK_DIR" -name "*-unsigned.apk" | head -n 1)

          if [ -f "$APK_FILE" ]; then
            SIGNED_APK="${APK_FILE%-unsigned.apk}.apk"
            echo "Signing APK: $APK_FILE"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore $CM_KEYSTORE_PATH -storepass $CM_KEYSTORE_PASSWORD \
              -keypass $CM_KEY_PASSWORD "$APK_FILE" $CM_KEY_ALIAS

            mv "$APK_FILE" "$SIGNED_APK"
            echo "✅ Signed APK: $SIGNED_APK"
          
          else
            # If the unsigned APK doesn't exist, check for an already signed APK
            SIGNED_APK=$(find "$APK_DIR" -name "*.apk" | head -n 1)

            if [ -f "$SIGNED_APK" ]; then
              echo "✅ Already signed APK found: $SIGNED_APK"
            else
              echo "❌ ERROR: No APK found (neither unsigned nor signed)"
              exit 1
            fi
          fi



      - name: Verify APK Directory
        script: |
          echo "APK directory contents:"
          ls -alh app/build/outputs/apk/release/

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: true
