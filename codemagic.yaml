workflows:

  # ------------------------------------------------------------------------------
  # 🛡️ PR CHECK (Fast Feedback)
  # ------------------------------------------------------------------------------
  pr-check:
    name: Estatia PR Check
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        CI: "true"
    scripts:
      - name: Set Permissions
        script: chmod +x ./gradlew
      - name: Lint
        script: ./gradlew lint --no-daemon
      - name: Unit Tests
        script: ./gradlew test --no-daemon
      - name: Verify Coverage
        script: ./gradlew jacocoProdDebugVerification --no-daemon
      - name: Smoke UI Test
        script: ./gradlew :app:pixel2Api34ProdDebugAndroidTest --no-daemon

  # ------------------------------------------------------------------------------
  # ⚓ MAIN BRANCH (Comprehensive Verification)
  # ------------------------------------------------------------------------------
  main-verification:
    name: Estatia Main Verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        CI: "true"
      groups:
        - signing_release
    scripts:
      - name: Set Permissions
        script: chmod +x ./gradlew
      - name: Lint
        script: ./gradlew lint --no-daemon
      - name: Unit Tests
        script: ./gradlew test --no-daemon
      - name: Full Test Suite (All GMDs)
        script: |
          ./gradlew :app:pixel2Api34ProdDebugAndroidTest \
                    :app:pixel6Api31ProdDebugAndroidTest \
                    :app:mediumPhoneApi33ProdDebugAndroidTest \
                    :app:pixelTabletApi34ProdDebugAndroidTest \
                    --no-daemon
      - name: Build Release APK
        script: ./gradlew assembleProdRelease --no-daemon
    artifacts:
      - app/build/outputs/apk/prod/release/*.apk

  # ------------------------------------------------------------------------------
  # 🔨 NIGHTLY (Stress & Optimization)
  # ------------------------------------------------------------------------------
  nightly-optimization:
    name: Estatia Nightly Optimization
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      schedule:
        - cron: "0 0 * * *"
          branch: main
    environment:
      vars:
        CI: "true"
    scripts:
      - name: Set Permissions
        script: chmod +x ./gradlew
      - name: Chaos Tests
        script: ./gradlew :app:pixel6Api31ProdDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.estatia.realestate.apps.chaos.FeedGestureChaosTest
      - name: Generate Baseline Profiles
        script: ./gradlew :app:generateProdBaselineProfile --no-daemon
      - name: Create Baseline Profile Branch
        script: |
          git config --global user.name "Estatia CI"
          git config --global user.email "ci@estatia.com"
          git checkout -b automation/baseline-profiles
          git add .
          if git commit -m "chore: update baseline profiles (nightly)"; then
            git push origin automation/baseline-profiles
            # Note: In a mature CI setup, you would use 'gh pr create' (GitHub) 
            # or the GitLab API here to automate PR/MR creation.
          else
            echo "No changes detected."
          fi
      - name: Run Benchmarks
        script: ./gradlew :benchmark:pixel6Api31ProdDebugAndroidTest --no-daemon
      - name: Code Quality & Mutation Testing
        script: |
          ./gradlew jacocoProdDebugReport --no-daemon
    artifacts:
      - benchmark/build/outputs/connected_android_test_additional_output/*
      - "**/build/reports/jacoco/**"
