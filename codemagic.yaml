workflows:
  native-android:
    name: Native Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "io.codemagic.androidquicksample"
      groups:
        - google_play      # Stores Google Play API credentials
        - android_signing  # Stores Keystore file & passwords
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - $CM_BUILD_DIR/app/build
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Set Gradlew Permissions
        script: |
          chmod +x ./gradlew
      - name: Enable Gradle Build Cache
        script: |
          ./gradlew --build-cache
      - name: Build Android release (APK)
        script: |
          ./gradlew assembleRelease -PversionCode=1.0 -PversionName=1.0.2 --build-cache
      - name: Sign the APK
        script: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore $CM_KEYSTORE_PATH -storepass $CM_KEYSTORE_PASSWORD \
          -keypass $CM_KEY_PASSWORD app/build/outputs/apk/release/app-release-unsigned.apk $CM_KEY_ALIAS
      - name: Verify APK Directory
        script: |
          echo "APK directory contents:"
          ls -alh app/build/outputs/apk/release/
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: true
