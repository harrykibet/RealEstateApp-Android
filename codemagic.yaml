workflows:
  native-android:
    name: Native Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "io.codemagic.androidquicksample"
      groups:
        - google_play      # Stores Google Play API credentials
        - android_signing  # Stores Keystore file & passwords
    cache:
      cache_paths:
        - ~/.gradle/wrapper
        - $CM_BUILD_DIR/app/build
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Set Gradlew Permissions
        script: |
          chmod +x ./gradlew
      - name: Enable Gradle Build Cache
        script: |
          ./gradlew --build-cache
      - name: Build Android release (APK)
        script: |
          ./gradlew assembleRelease -PversionCode=1.0 -PversionName=1.0.2 --build-cache
      - name: Check APK Existence
        script: |
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK found: $APK_PATH"
          else
            echo "❌ ERROR: APK not found at $APK_PATH"
            exit 1
          fi
      - name: Sign the APK
        script: |
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore $CM_KEYSTORE_PATH -storepass $CM_KEYSTORE_PASSWORD \
            -keypass $CM_KEY_PASSWORD "$APK_PATH" $CM_KEY_ALIAS

          mv "$APK_PATH" "$SIGNED_APK"
      - name: Verify APK Directory
        script: |
          echo "APK directory contents:"
          ls -alh app/build/outputs/apk/release/
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - trmnjames@gmail.com
        notify:
          success: true
          failure: true
