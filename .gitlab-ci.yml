# Define the base image with pre-installed Android SDK
image: ghcr.io/cirruslabs/android-sdk:33

# Define global variables
variables:
  ANDROID_SDK_ROOT: /sdk
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  CI_DEBUG_TRACE: "true"

# Enable caching to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}-gradle-cache
  paths:
    - .gradle/
    - .gradle/caches/
    - .gradle/wrapper/

# Define pipeline stages
stages:
  - setup
  - build
  - test

# Step 1: Setup environment and licenses
setup:
  stage: setup
  script:
    - echo "Setting up Android environment"
    - export PATH="$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - chmod +x ./gradlew
    - sdkmanager --version
    - yes | sdkmanager --licenses
    - sdkmanager "platform-tools" "build-tools;33.0.0" "platforms;android-33"

# Step 2: Build the project
build:
  stage: build
  script:
    - echo "Building the project"
    - ./gradlew clean build --stacktrace --info
  artifacts:
    paths:
      - app/build/outputs/
    expire_in: 1 week

# Step 3: Run tests (unit and instrumented)
test:
  stage: test
  script:
    - echo "Running tests"
    - ./gradlew testDebugUnitTest --stacktrace --info
    - ./gradlew connectedDebugAndroidTest --stacktrace --info
  artifacts:
    paths:
      - app/build/reports/
      - app/build/outputs/
    expire_in: 1 week

# Optional: Notifications on pipeline success or failure
notifications:
  stage: deploy
  script:
    - echo "Job completed successfully. Check artifacts for results."
