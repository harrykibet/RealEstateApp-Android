stages:
  - build

image: ghcr.io/cirruslabs/android-sdk:30  # ✅ Pre-installed Android SDK & Java 17

before_script:
  - java -version  # ✅ Verify Java is installed
  - sdkmanager --list  # ✅ Check available Android SDKs
  - chmod +x ./gradlew  # ✅ Ensure Gradle wrapper is executable

build-apk:
  stage: build
  script:
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/
