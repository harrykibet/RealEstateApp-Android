stages:
  - build
  - test
  - deploy

# Cache Gradle dependencies
cache:
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

# Build Job
build:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - chmod +x ./gradlew  # Set executable permission for gradlew
    - apt-get update -y
    - apt-get install -y wget unzip
    - wget https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip
    - unzip commandlinetools-linux-7302050_latest.zip -d $ANDROID_HOME/cmdline-tools
    - yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses
    - $ANDROID_HOME/cmdline-tools/bin/sdkmanager "platform-tools" "platforms;android-30"
    - ./gradlew clean assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 hour

# Test Job (if you want to run tests, adapt as needed)
test:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - chmod +x ./gradlew  # Ensure permission for gradlew
    - ./gradlew test

# Deploy Job
deploy:
  stage: deploy
  image: ghcr.io/cirruslabs/android-sdk:33
  dependencies:
    - build  # Ensure deployment depends on build stage artifacts
  script:
    - chmod +x ./gradlew  # Ensure permission for gradlew
    - mv app/build/outputs/apk/release/app-release.apk app-release-${CI_COMMIT_REF_NAME}.apk
  artifacts:
    paths:
      - app-release-${CI_COMMIT_REF_NAME}.apk
    expire_in: 7 days
