# GitLab CI/CD for Android with Keystore Signing

stages:
  - setup
  - build

variables:
  ANDROID_SDK_ROOT: /sdk
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

cache:
  key: ${CI_COMMIT_REF_SLUG}-gradle-cache
  paths:
    - .gradle/
    - .gradle/caches/
    - .gradle/wrapper/

# Step 1: Setup environment
setup:
  stage: setup
  script:
    - echo "Setting up Android environment"
    - chmod +x ./gradlew  # Set executable permission for gradlew
    - export PATH="$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - sdkmanager --version
    - yes | sdkmanager --licenses
    - sdkmanager "platform-tools" "build-tools;33.0.0" "platforms;android-33"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# Step 2: Build APK with Keystore Signing
build:
  stage: build
  script:
    # Set executable permissions for gradlew (if not already done)
    - chmod +x ./gradlew  

    # Generate local.properties
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    # Build APK
    - echo "Building APK with Gradle"
    - ./gradlew assembleRelease --stacktrace --info

    # Debug: List build output directory
    - echo "Listing Build Output Directory"
    - ls -alh app/build/outputs/apk/

  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
