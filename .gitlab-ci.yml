stages:
  - build
  - test
  - deploy

# Cache Gradle dependencies
cache:
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

# Build Job
build:
  stage: build
  image: openjdk:17
  script:
    - apt-get update -y
    - apt-get install -y wget unzip
    - wget https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip
    - unzip commandlinetools-linux-7302050_latest.zip -d $ANDROID_HOME/cmdline-tools
    - yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses
    - $ANDROID_HOME/cmdline-tools/bin/sdkmanager "platform-tools" "platforms;android-30"
    - ./gradlew clean assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 hour

# Test Job (if you want to run tests, adapt as needed)
test:
  stage: test
  image: openjdk:17
  script:
    - ./gradlew test

# Deploy Job (example if you want to deploy somewhere)
deploy:
  stage: deploy
  image: openjdk:17
  script:
    - echo "Deploying app"
    # Add your deployment steps here, e.g., uploading to a server or an artifact repository
