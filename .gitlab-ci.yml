stages:
  - build

image: cirrusci/android-sdk:30  # ✅ Correct Android SDK image from Docker Hub

before_script:
  - java -version  # ✅ Verify Java installation
  - sdkmanager --list  # ✅ Check available Android SDKs
  - chmod +x ./gradlew  # ✅ Ensure Gradle wrapper is executable

build-apk:
  stage: build
  script:
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/
