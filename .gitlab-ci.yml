stages:
  - build
  - test
  - deploy

# Cache Gradle dependencies
cache:
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

# Build Job
build:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - chmod +x ./gradlew  # Set executable permission for gradlew
    - yes | sdkmanager --licenses  # Accept licenses
    - sdkmanager "platform-tools" "platforms;android-33"  # Install required tools
    - ./gradlew clean assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 hour

# Test Job
test:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - chmod +x ./gradlew  # Ensure permission for gradlew
    - ./gradlew test

# Deploy Job
deploy:
  stage: deploy
  image: ghcr.io/cirruslabs/android-sdk:33
  dependencies:
    - build  # Ensure deployment depends on build stage artifacts
  script:
    - chmod +x ./gradlew  # Ensure permission for gradlew
    - mv app/build/outputs/apk/release/app-release.apk app-release-${CI_COMMIT_REF_NAME}.apk
  artifacts:
    paths:
      - app-release-${CI_COMMIT_REF_NAME}.apk
    expire_in: 7 days
