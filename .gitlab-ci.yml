stages:
  - build
  - test
  - deploy

# Cache Gradle dependencies
cache:
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

# Build Job
build:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:33
  variables:
    ANDROID_SDK_ROOT: /sdk  # Set the correct Android SDK root
  script:
    - chmod +x ./gradlew  # Ensure executable permission for gradlew
    - sdkmanager --version  # Check if sdkmanager is available
    - yes | sdkmanager --licenses  # Accept licenses
    - sdkmanager "platform-tools" "platforms;android-33"  # Install platform tools
    - ./gradlew clean assembleRelease  # Build APK
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 hour

# Test Job
test:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:33
  variables:
    ANDROID_SDK_ROOT: /sdk  # Set the correct Android SDK root
  script:
    - chmod +x ./gradlew  # Ensure executable permission for gradlew
    - ./gradlew test  # Run tests

# Deploy Job
deploy:
  stage: deploy
  image: ghcr.io/cirruslabs/android-sdk:33
  variables:
    ANDROID_SDK_ROOT: /sdk  # Set the correct Android SDK root
  dependencies:
    - build  # Ensure deployment depends on build stage artifacts
  script:
    - mv app/build/outputs/apk/release/app-release.apk app-release-${CI_COMMIT_REF_NAME}.apk  # Rename APK
  artifacts:
    paths:
      - app-release-${CI_COMMIT_REF_NAME}.apk
    expire_in: 7 days
