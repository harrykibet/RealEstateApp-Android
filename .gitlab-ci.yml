stages:
  - architecture
  - verification
  - build
  - optimize

image: cirrusci/android-sdk:34

variables:
  CI: "true"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"

before_script:
  - apt-get update && apt-get install -y openjdk-17-jdk
  - export PATH="$JAVA_HOME/bin:$PATH"
  - chmod +x ./gradlew
  - echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

# ------------------------------------------------------------------------------
# 🛡️ PR CHECK (High Maturity Gate)
# ------------------------------------------------------------------------------

pr-architecture-gate:
  stage: architecture
  script:
    - ./gradlew verifyArchitecture --stacktrace --info
    # Selective Testing: Determine impacted tasks
    - ./gradlew calculateImpact > impact_output.txt
    - TASKS=$(grep "IMPACT_TASKS=" impact_output.txt | cut -d'=' -f2)
    - echo "TASKS_TO_RUN=$TASKS" >> build.env
    # Self-Healing Ratchet: Update baselines if violations decreased
    - ./gradlew lint -Dlint.update.baseline=true
    - |
      if [[ `git status --porcelain` ]]; then
        git config --global user.name "Estatia CI"
        git config --global user.email "ci@estatia.com"
        git add "**/lint-baseline.xml"
        git commit -m "chore: auto-update lint baselines (ratchet)"
        git push "https://ci-user:${CI_PUSH_TOKEN}@${CI_REPOSITORY_URL#*@}" HEAD:${CI_COMMIT_REF_NAME}
      fi
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pr-impacted-verification:
  stage: verification
  needs: ["pr-architecture-gate"]
  script:
    - |
      if [ -n "$TASKS_TO_RUN" ]; then
        ./gradlew $TASKS_TO_RUN --stacktrace
      else
        echo "No impacted modules detected. Skipping logic verification."
      fi
    - ./gradlew jacocoProdDebugVerification --stacktrace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pr-smoke-ui-test:
  stage: verification
  needs: ["pr-impacted-verification"]
  script:
    - ./gradlew :app:pixel2Api34ProdDebugAndroidTest --stacktrace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ------------------------------------------------------------------------------
# ⚓ MAIN BRANCH (Authoritative Verification)
# ------------------------------------------------------------------------------

main-verification:
  stage: architecture
  script:
    - ./gradlew verifyArchitecture --stacktrace --info
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

main-full-test:
  stage: verification
  needs: ["main-verification"]
  script:
    - ./gradlew test --stacktrace
    - |
      ./gradlew :app:pixel2Api34ProdDebugAndroidTest \
                :app:pixel6Api31ProdDebugAndroidTest \
                :app:mediumPhoneApi33ProdDebugAndroidTest \
                :app:pixelTabletApi34ProdDebugAndroidTest \
                --stacktrace
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

main-build-release:
  stage: build
  needs: ["main-full-test"]
  script:
    - ./gradlew assembleProdRelease -PsigningStoreFile=$RELEASE_KEYSTORE --stacktrace
  artifacts:
    paths:
      - app/build/outputs/apk/prod/release/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ------------------------------------------------------------------------------
# 🔨 NIGHTLY (Stress & Audit)
# ------------------------------------------------------------------------------

nightly-audit:
  stage: architecture
  script:
    # Exhaustive variant audit
    - ./gradlew verifyArchitecture lint --stacktrace --info
    - ./gradlew :app:assembleProdRelease
    - ./gradlew auditBinaryPurity
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

nightly-chaos-tests:
  stage: verification
  script:
    - ./gradlew :app:pixel6Api31ProdDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.estatia.realestate.apps.chaos.FeedGestureChaosTest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

nightly-optimization:
  stage: optimize
  script:
    - ./gradlew :app:generateProdBaselineProfile
    - ./gradlew :benchmark:pixel6Api31ProdDebugAndroidTest
    - ./gradlew jacocoProdDebugReport
  artifacts:
    paths:
      - benchmark/build/outputs/connected_android_test_additional_output/
      - "**/build/reports/jacoco/"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
