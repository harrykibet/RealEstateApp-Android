stages:
  - setup
  - build
  - test
  - deploy

variables:
  ANDROID_SDK_ROOT: /sdk
  ANDROID_HOME: /sdk
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - app/build/

# Stage 1: Setup
setup:
  stage: setup
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - echo "Setting up environment"
    - chmod +x ./gradlew
    - sdkmanager --version
    - yes | sdkmanager --licenses
    - sdkmanager "platform-tools" "platforms;android-33"
  rules:
    - when: always

# Stage 2: Build
build:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - echo "Building the APK"
    - ./gradlew clean assembleRelease --stacktrace --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH  # Only run on branches

# Stage 3: Test
test:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - echo "Running tests"
    - ./gradlew test --stacktrace --no-daemon
  rules:
    - if: $CI_COMMIT_BRANCH  # Only run on branches

# Stage 4: Deploy
deploy:
  stage: deploy
  image: ghcr.io/cirruslabs/android-sdk:33
  dependencies:
    - build
  script:
    - echo "Deploying the APK"
    - mv app/build/outputs/apk/release/app-release.apk app-release-${CI_COMMIT_REF_NAME}.apk
  artifacts:
    paths:
      - app-release-${CI_COMMIT_REF_NAME}.apk
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG  # Only run on tags
