stages:
  - lint
  - test
  - build
  - optimize

image: cirrusci/android-sdk:34

variables:
  CI: "true"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"

before_script:
  - apt-get update && apt-get install -y openjdk-17-jdk
  - export PATH="$JAVA_HOME/bin:$PATH"
  - chmod +x ./gradlew
  - echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

# ------------------------------------------------------------------------------
# 🛡️ PR CHECK (Fast Feedback)
# ------------------------------------------------------------------------------

pr-lint:
  stage: lint
  script:
    - ./gradlew lint --stacktrace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pr-unit-test:
  stage: test
  script:
    - ./gradlew test --stacktrace
    - ./gradlew jacocoProdDebugVerification --stacktrace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pr-smoke-ui-test:
  stage: test
  needs: ["pr-unit-test"]
  script:
    - ./gradlew :app:pixel2Api34ProdDebugAndroidTest --stacktrace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ------------------------------------------------------------------------------
# ⚓ MAIN BRANCH (Comprehensive Verification)
# ------------------------------------------------------------------------------

main-lint:
  stage: lint
  script:
    - ./gradlew lint --stacktrace
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

main-full-test:
  stage: test
  needs: ["main-lint"]
  script:
    - ./gradlew test --stacktrace
    - |
      ./gradlew :app:pixel2Api34ProdDebugAndroidTest \
                :app:pixel6Api31ProdDebugAndroidTest \
                :app:mediumPhoneApi33ProdDebugAndroidTest \
                :app:pixelTabletApi34ProdDebugAndroidTest \
                --stacktrace
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

main-build-release:
  stage: build
  needs: ["main-full-test"]
  script:
    # Assuming signing secrets are in GitLab CI/CD Variables
    - ./gradlew assembleProdRelease -PsigningStoreFile=$RELEASE_KEYSTORE --stacktrace
  artifacts:
    paths:
      - app/build/outputs/apk/prod/release/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ------------------------------------------------------------------------------
# 🔨 NIGHTLY (Stress & Optimization)
# ------------------------------------------------------------------------------

nightly-chaos-tests:
  stage: test
  script:
    - ./gradlew :app:pixel6Api31ProdDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.estatia.realestate.apps.chaos.FeedGestureChaosTest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

nightly-baseline-profile:
  stage: optimize
  script:
    - ./gradlew :app:generateProdBaselineProfile
    - |
      git config --global user.name "Estatia CI"
      git config --global user.email "ci@estatia.com"
      git checkout -b automation/baseline-profiles
      git add .
      if git commit -m "chore: update baseline profiles (nightly)"; then
        git push "https://ci-user:${CI_PUSH_TOKEN}@${CI_REPOSITORY_URL#*@}" automation/baseline-profiles \
          -o merge_request.create \
          -o merge_request.target=main \
          -o merge_request.title="Update Baseline Profiles (Nightly)" \
          -o merge_request.remove_source_branch=true \
          -o merge_request.description="Automated baseline profile generation from nightly run."
      else
        echo "No changes to baseline profiles."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

nightly-benchmarks:
  stage: optimize
  script:
    - ./gradlew :benchmark:pixel6Api31ProdDebugAndroidTest
  artifacts:
    paths:
      - benchmark/build/outputs/connected_android_test_additional_output/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

nightly-quality-metrics:
  stage: optimize
  script:
    - ./gradlew jacocoProdDebugReport
  artifacts:
    paths:
      - "**/build/reports/jacoco/"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
