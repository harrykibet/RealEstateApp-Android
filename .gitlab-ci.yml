stages:
  - test
  - build

image: cirrusci/android-sdk:30  # ✅ Android SDK Docker image

variables:
  CI: "true"  # ✅ Define CI environment variable for Kotlin daemon optimization

before_script:
  - apt-get update && apt-get install -y openjdk-17-jdk  # ✅ Ensure Java 17 is installed
  - export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
  - export PATH="$JAVA_HOME/bin:$PATH"
  - java -version  # ✅ Verify Java installation
  - chmod +x ./gradlew  # ✅ Ensure Gradle wrapper is executable
  - echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties  # ✅ Create `local.properties`

  # ✅ Generate Debug Keystore
  - |
    DEBUG_KEYSTORE_PATH="$HOME/.android/debug.keystore"

    if [ -f "$DEBUG_KEYSTORE_PATH" ]; then
      echo "Removing existing debug keystore..."
      rm -f "$DEBUG_KEYSTORE_PATH"
    fi

    echo "Generating new debug keystore..."
    keytool -genkey -v \
      -keystore "$DEBUG_KEYSTORE_PATH" \
      -storepass android \
      -alias androiddebugkey \
      -keypass android \
      -dname "CN=Android Debug,O=Android,C=US" \
      -keyalg RSA \
      -keysize 2048 \
      -validity 10000

    echo "Debug keystore generated at $DEBUG_KEYSTORE_PATH"

unit-test:
  stage: test
  script:
    - ./gradlew test --stacktrace

build-apk:
  stage: build
  needs: ["unit-test"]
  script:
    - ./gradlew assembleRelease --stacktrace
  artifacts:
    paths:
      - app/build/outputs/apk/release/
