stages:
  - build
  - test
  - deploy

# Cache Gradle dependencies
cache:
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

# Build Job
build:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - ./gradlew clean assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    expire_in: 1 hour

# Test Job (optional, ensure your project includes tests)
test:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:33
  script:
    - ./gradlew test

# Deploy Job (includes deployment artifacts)
deploy:
  stage: deploy
  image: ghcr.io/cirruslabs/android-sdk:33
  dependencies:
    - build  # Ensure deployment depends on build stage artifacts
  script:
    - mv app/build/outputs/apk/release/app-release.apk app-release-${CI_COMMIT_REF_NAME}.apk
  artifacts:
    paths:
      - app-release-${CI_COMMIT_REF_NAME}.apk
    expire_in: 7 days
